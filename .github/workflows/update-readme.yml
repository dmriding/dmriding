name: Update README SVGs

on:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches: [main]
  workflow_dispatch:

concurrency: stats

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # STATS_TOKEN can write to every repo: no tag-pinned or third-party action in this job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test
        run: python3 -m unittest -q

      - name: Render cards
        run: python3 today.py
        env:
          # No fallback to secrets.GITHUB_TOKEN: it sees public repos only.
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN }}

      # main requires signed commits via PR, so the cards live on a bot-only branch.
      - name: Publish cards to the stats branch
        run: |
          git checkout -q --orphan stats
          git rm -rq --cached .
          git add -f dark_mode.svg light_mode.svg
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -qm 'chore: update stats'
          git push -f origin stats
